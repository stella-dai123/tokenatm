<script>
const KEY='token-atm-v1';let storageKey=KEY;const CloudConfig=window.TOKEN_ATM_CLOUD||{};
const initial=()=>({tasks:[{id:'t1',name:'专注学习 25 分钟',category:'学习',points:10},{id:'t2',name:'阅读并整理一页笔记',category:'学习',points:15},{id:'t3',name:'散步 30 分钟',category:'运动',points:15},{id:'t4',name:'完成一次力量训练',category:'运动',points:25},{id:'t5',name:'规律吃饭，认真休息',category:'习惯',points:10},{id:'t6',name:'睡前拉伸 10 分钟',category:'运动',points:10}],rewards:[{id:'r1',name:'放松看一集喜欢的剧',points:30},{id:'r2',name:'畅玩游戏 1 小时',points:50},{id:'r3',name:'给自己买一件小礼物',points:150}],transactions:[],meals:[]});
function validMeals(rows){return Array.isArray(rows)&&rows.every(x=>typeof x.id==='string'&&typeof x.name==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x.day)&&['早餐','午餐','晚餐','加餐 / 饮品','运动'].includes(x.type)&&Number.isInteger(x.calories)&&x.calories>=0&&x.calories<=10000)}
function validBody(rows){return Array.isArray(rows)&&rows.every(x=>typeof x.id==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x.day)&&Number.isFinite(x.weight)&&x.weight>0&&x.weight<=500&&['bust','waist','hips'].every(k=>x[k]===null||Number.isFinite(x[k])&&x[k]>0&&x[k]<=300))}
function validCourseDate(value){return typeof value==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(value)&&value.slice(0,4)!=='0000'&&!Number.isNaN(Date.parse(value+'T00:00:00Z'))&&new Date(value+'T00:00:00Z').toISOString().slice(0,10)===value}
function validCourses(rows){return Array.isArray(rows)&&rows.every(c=>typeof c.id==='string'&&typeof c.name==='string'&&c.name.trim().length>0&&c.name.length<=100&&(c.examDate===null||validCourseDate(c.examDate))&&Array.isArray(c.tasks)&&c.tasks.every(t=>typeof t.id==='string'&&typeof t.name==='string'&&t.name.trim().length>0&&t.name.length<=200&&typeof t.done==='boolean'))}
function valid(s){return s&&(s.courses===undefined||validCourses(s.courses))&&(s.body===undefined||validBody(s.body))&&(s.targetWeight===undefined||s.targetWeight===null||Number.isFinite(s.targetWeight)&&s.targetWeight>0&&s.targetWeight<=500)&&(s.meals===undefined||validMeals(s.meals))&&Array.isArray(s.tasks)&&Array.isArray(s.rewards)&&Array.isArray(s.transactions)&&[...s.tasks,...s.rewards].every(x=>typeof x.id==='string'&&typeof x.name==='string'&&Number.isSafeInteger(x.points)&&x.points>0&&x.points<=10000)&&s.transactions.every(x=>typeof x.id==='string'&&typeof x.name==='string'&&Number.isSafeInteger(x.amount)&&typeof x.date==='string'&&typeof x.day==='string')}
let state;try{state=JSON.parse(localStorage.getItem(KEY));if(!valid(state))state=initial()}catch{state=initial()}let tab='tasks',mainTab='token';const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const day=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};let foodDay=day();const balance=()=>state.transactions.reduce((n,t)=>n+t.amount,0);const done=id=>state.transactions.some(t=>t.taskId===id&&t.day===day());let toastTimer;
function toast(text){$('#toast').textContent=text;$('#toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').style.display='none',3000)}
function commit(next){try{localStorage.setItem(storageKey,JSON.stringify(next));state=next;render();queueCloudSave();return true}catch{toast('浏览器无法保存，请检查存储空间或隐私设置。');return false}}

function bodyChart(rows,target){if(!rows.length)return '<p class="empty">添加体重记录后，趋势图会显示在这里。</p>';const values=rows.map(x=>x.weight).concat(target?[target]:[]);const lo=Math.floor(Math.min(...values)-1),hi=Math.ceil(Math.max(...values)+1);const w=700,h=220,left=48,right=24,top=20,bottom=35;const start=new Date(rows[0].day+'T00:00:00Z').getTime(),end=new Date(rows.at(-1).day+'T00:00:00Z').getTime();const x=row=>end===start?w/2:left+(new Date(row.day+'T00:00:00Z').getTime()-start)/(end-start)*(w-left-right);const y=value=>top+(hi-value)/(hi-lo)*(h-top-bottom);let svg='<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="体重趋势，按记录日期绘制，单位千克">';for(let i=0;i<4;i++){const value=lo+(hi-lo)*i/3;svg+='<line x1="'+left+'" x2="'+(w-right)+'" y1="'+y(value)+'" y2="'+y(value)+'" stroke="#eee8f4"/><text x="4" y="'+(y(value)+4)+'" fill="#93869e" font-size="12">'+value.toFixed(1)+'</text>'}if(target)svg+='<line x1="'+left+'" x2="'+(w-right)+'" y1="'+y(target)+'" y2="'+y(target)+'" stroke="#c79d70" stroke-dasharray="5 5"/><text x="'+(left+6)+'" y="'+(y(target)-7)+'" fill="#ad8154" font-size="11">目标 '+target+' kg</text>';svg+='<polyline points="'+rows.map(row=>x(row)+','+y(row.weight)).join(' ')+'" fill="none" stroke="#9271d4" stroke-width="3"/>';for(const row of rows)svg+='<circle cx="'+x(row)+'" cy="'+y(row.weight)+'" r="5" fill="#9271d4"><title>'+esc(row.day)+': '+row.weight+' kg</title></circle>';svg+='<text x="'+left+'" y="'+(h-6)+'" fill="#93869e" font-size="11">'+esc(rows[0].day)+'</text><text x="'+(w-right)+'" text-anchor="end" y="'+(h-6)+'" fill="#93869e" font-size="11">'+esc(rows.at(-1).day)+'</text></svg>';return svg;}

let cloudSession=null,cloudRevision=null,cloudReady=false,cloudDirty=false,cloudConflict=false,cloudBusy=false,saveTimer;
const sessionKey='token-atm-session-v1';
function saveSyncMeta(){if(cloudSession)localStorage.setItem(storageKey+':sync',JSON.stringify({revision:cloudRevision,dirty:cloudDirty,ready:cloudReady,conflict:cloudConflict}))}
function syncStatus(text){$('#sync-status').textContent=text;$('#cloud-open').textContent=cloudSession?'☁ 已登录 · 同步':'☁ 登录同步'}
function configured(){return /^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(CloudConfig.url||'')&&typeof CloudConfig.key==='string'&&CloudConfig.key.length>20}
async function cloudRequest(path,options={},authenticated=true){if(!configured())throw Error('云端配置尚未完成。请稍后再登录。');if(authenticated&&!cloudSession)throw Error('请先登录');if(authenticated&&cloudSession.expires_at*1000<Date.now()+60000){const response=await cloudRequest('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:cloudSession.refresh_token})},false);cloudSession=response;localStorage.setItem(sessionKey,JSON.stringify(response))}const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);try{const response=await fetch(CloudConfig.url+path,{...options,signal:controller.signal,headers:{apikey:CloudConfig.key,'Content-Type':'application/json',...(authenticated?{Authorization:'Bearer '+cloudSession.access_token}:{}),...options.headers}});const text=await response.text();let result;try{result=text?JSON.parse(text):null}catch{throw Error('云端响应异常，请稍后重试')}if(!response.ok)throw Error(result?.msg||result?.message||result?.error_description||'同步失败，请检查网络或登录状态');return result}finally{clearTimeout(timer)}}
async function loadCloud(force=false){if(cloudBusy)return;cloudBusy=true;try{const rows=await cloudRequest('/rest/v1/habit_state?user_id=eq.'+encodeURIComponent(cloudSession.user.id)+'&select=data,revision');const row=rows[0];if(row&&!valid(row.data))throw Error('云端数据格式异常，本地记录仍保留');if(cloudDirty&&!force){cloudReady=true;if(row&&row.revision!==cloudRevision){cloudConflict=true;syncStatus('另一设备有新记录；本地修改已保留，请点击登录同步处理')}else if(!row)cloudRevision=null;saveSyncMeta();return}if(force&&cloudDirty&&!confirm('将用云端记录替换当前账号的未同步修改。继续吗？'))return;if(row){if(cloudDirty)localStorage.setItem(storageKey+':recovery',JSON.stringify(state));localStorage.setItem(storageKey,JSON.stringify(row.data));state=row.data;cloudRevision=row.revision;cloudDirty=false;cloudConflict=false;cloudReady=true;render();syncStatus('已同步 · '+cloudSession.user.email)}else{cloudRevision=null;cloudReady=true;cloudDirty=true;cloudConflict=false;syncStatus('正在建立云端记录…')}}catch(e){syncStatus('同步未完成：'+e.message);throw e}finally{cloudBusy=false;saveSyncMeta();if(cloudDirty&&cloudReady&&!cloudConflict)setTimeout(flushCloud,500)}}
function queueCloudSave(){if(!cloudSession)return;cloudDirty=true;saveSyncMeta();syncStatus('已保存到此设备 · 等待同步');clearTimeout(saveTimer);saveTimer=setTimeout(flushCloud,500)}
async function flushCloud(){if(!cloudSession||!cloudReady||cloudBusy||!cloudDirty||cloudConflict)return;cloudBusy=true;const snapshot=JSON.stringify(state),revision=cloudRevision;try{let rows;if(revision===null){rows=await cloudRequest('/rest/v1/habit_state',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({user_id:cloudSession.user.id,data:JSON.parse(snapshot),revision:1})})}else{rows=await cloudRequest('/rest/v1/habit_state?user_id=eq.'+encodeURIComponent(cloudSession.user.id)+'&revision=eq.'+revision,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({data:JSON.parse(snapshot),revision:revision+1,updated_at:new Date().toISOString()})})}if(!rows?.length){cloudConflict=true;syncStatus('另一设备有新记录；本地修改已保留，请点击登录同步处理');return}cloudRevision=rows[0].revision;cloudDirty=JSON.stringify(state)!==snapshot;syncStatus(cloudDirty?'正在同步后续修改…':'已同步 · '+cloudSession.user.email)}catch(e){syncStatus('自动同步失败，本地已保存：'+e.message)}finally{cloudBusy=false;saveSyncMeta()}if(cloudDirty&&!cloudConflict)setTimeout(()=>{if(navigator.onLine)flushCloud()},15000)}
async function activateSession(session){cloudSession=session;localStorage.setItem(sessionKey,JSON.stringify(session));storageKey=KEY+':'+session.user.id;cloudReady=false;cloudRevision=null;cloudDirty=false;cloudConflict=false;const meta=JSON.parse(localStorage.getItem(storageKey+':sync')||'null');if(meta){cloudRevision=meta.revision;cloudDirty=!!meta.dirty;cloudReady=!!meta.ready;cloudConflict=!!meta.conflict}const cached=localStorage.getItem(storageKey);if(cached){const data=JSON.parse(cached);if(valid(data))state=data}else if(state.transactions.length||(state.meals||[]).length||(state.body||[]).length){if(!confirm('当前有本地记录。若云端已有记录，将优先载入云端；原本地记录仍保留。继续登录？')){cloudSession=null;storageKey=KEY;localStorage.removeItem(sessionKey);return}}localStorage.setItem(storageKey,JSON.stringify(state));render();await loadCloud();$('#cloud-dialog').close()}
$('#cloud-open').onclick=()=>{$('#cloud-error').textContent='';$('#cloud-dialog').showModal()};$('#cloud-close').onclick=()=>$('#cloud-dialog').close();
async function authenticate(signup){if(cloudBusy){$('#cloud-error').textContent='请等待当前同步完成';return}if(cloudSession){$('#cloud-error').textContent='切换账号前请先退出当前账号';return}$('#cloud-error').textContent='正在连接…';const email=$('#cloud-email').value.trim(),password=$('#cloud-password').value;if(!$('#cloud-form').reportValidity())return;try{const result=await cloudRequest(signup?'/auth/v1/signup':'/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})},false);$('#cloud-password').value='';if(result.access_token)await activateSession(result);else $('#cloud-error').textContent='请查收确认邮件，确认邮箱后再回到这里登录。'}catch(e){$('#cloud-error').textContent=e.message}}
$('#cloud-form').onsubmit=e=>{e.preventDefault();authenticate(false)};$('#cloud-signup').onclick=()=>authenticate(true);$('#cloud-reload').onclick=()=>{if(cloudSession)loadCloud(true).catch(e=>$('#cloud-error').textContent=e.message)};$('#cloud-retry').onclick=()=>{if(cloudSession){if(cloudConflict){$('#cloud-error').textContent='存在不同设备的修改。请先获取云端记录；本地修改不会自动覆盖云端。';return}if(cloudReady)flushCloud();else loadCloud().catch(e=>$('#cloud-error').textContent=e.message)}};
$('#cloud-signout').onclick=()=>{if(cloudBusy){toast('请等待当前同步完成');return}if(cloudDirty&&!confirm('有尚未同步的记录，退出后仍保存在此设备。确定退出？'))return;clearTimeout(saveTimer);cloudSession=null;cloudReady=false;cloudDirty=false;cloudConflict=false;localStorage.removeItem(sessionKey);storageKey=KEY;try{const saved=JSON.parse(localStorage.getItem(KEY));state=valid(saved)?saved:initial()}catch{state=initial()}render();syncStatus('本地模式 · 已退出云端账号');$('#cloud-dialog').close()};window.addEventListener('online',()=>{if(cloudSession){if(cloudDirty)flushCloud();else loadCloud().catch(()=>{})}});window.addEventListener('focus',()=>{if(cloudSession&&!cloudBusy){if(cloudDirty)flushCloud();else loadCloud().catch(()=>{})}});setInterval(()=>{if(cloudSession&&!cloudBusy&&!cloudDirty)loadCloud().catch(()=>{})},30000);
render();try{const session=JSON.parse(localStorage.getItem(sessionKey));if(session?.user?.id&&configured())activateSession(session).catch(()=>{})}catch{syncStatus('本地模式 · 请重新登录')}
