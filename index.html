content;border-radius:15px;padding:5px;gap:3px;margin-bottom:34px}.tabs button{color:#8b829b;border-radius:11px;padding:11px 23px;font-size:13px;transition:background .2s,color .2s}.tabs button.active{background:white;color:#7255c8;box-shadow:0 2px 8px #3b235e0b}.section-head{margin-bottom:23px}h2{font-size:22px;letter-spacing:-.5px;color:#3a304c}.muted{font-size:12px;color:#9890a3;line-height:1.8}.outline{border-color:#e2dcec;background:#ffffffb0;color:#79668e;font-size:12px;padding:11px 16px;transition:background .2s}.outline:hover{background:#eee7ff}.grid{gap:20px}.card{border:1px solid #ede8f4;border-radius:22px;padding:24px;background:#ffffffdd;box-shadow:0 4px 18px #59457404;transition:transform .2s,box-shadow .2s,border-color .2s;position:relative;overflow:hidden}.card:hover{transform:translateY(-4px);box-shadow:0 12px 25px #5945740d;border-color:#d8caed}.card h3{font-size:16px;font-weight:650;color:#3a3346;letter-spacing:-.2px}.card p{font-size:12px;color:#a098ad}.icon{background:#f1ebff;width:48px;height:48px;border-radius:16px}.card:nth-child(3n) .icon{background:#e9f4e9}.card:nth-child(3n+2) .icon{background:#fff0df}.pill{font-size:10px;background:#f2eef9;color:#9788b1;letter-spacing:.5px;padding:5px 10px}.tokens{color:#8961d0;font-size:14px;letter-spacing:-.3px}.card-foot{margin-top:8px;padding-top:18px;border-top:1px dashed #eee8f4}.primary{background:#efe7ff;color:#7951c7;font-size:12px;border-radius:10px;padding:11px 15px;transition:background .2s,transform .2s}.primary:hover:not(:disabled){background:#7957cf;color:white;transform:translateY(-1px)}.primary:disabled{background:#f0f5ec;color:#92a386}.danger{color:#a59bb3;font-size:11px;align-self:flex-start}.danger:hover{color:#90677c}.history{border:1px solid #ece5f4;background:#ffffffd9;border-radius:22px}.entry{border-color:#f0ebf5;font-size:14px}.entry small{color:#a399af;font-size:11px}.negative{color:#cf946b}dialog{color:#302844;background:#fcfaff;border:1px solid #e8dff5}dialog::backdrop{background:#30234766;backdrop-filter:blur(4px)}input,select{background:white;border-color:#e5ddee}input:focus,select:focus{outline:2px solid #cbb5ef;outline-offset:2px}footer{border-top:1px solid #e7dfef;padding-top:22px;margin-top:35px;font-size:11px;color:#a094b0;line-height:1.8}#toast{background:#6d51b7;box-shadow:0 8px 30px #6d51b730;font-size:13px}button:focus-visible{outline-color:#b399e6}@media(min-width:721px) and (max-width:1000px){h1{font-size:36px}.hero{gap:24px}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:720px){header{padding:22px 20px}.logo{font-size:20px;gap:5px}.logo:before{padding:5px 9px;border-radius:10px}header small{font-size:10px;padding:7px 9px}main{padding:0 20px 35px}.hero{gap:20px;margin:6px 0 28px}.intro{padding:12px 0 0}h1{font-size:34px;letter-spacing:-1px;margin:16px 0 10px}.intro p{font-size:12px;margin-bottom:0}.eyebrow{font-size:9px;letter-spacing:1.8px}.wallet{padding:26px;min-height:238px;border-radius:24px}.balance{font-size:65px;margin:19px 0 23px}.tabs{width:100%;margin-bottom:25px}.tabs button{flex:1;padding:11px 9px;font-size:12px}.section-head{align-items:flex-start;gap:10px}h2{font-size:19px}.muted{font-size:10px}.outline{font-size:11px;white-space:nowrap;padding:10px 12px}.grid{gap:14px}.card{padding:22px}.card h3{font-size:17px}.card-foot{margin-top:3px}.primary{padding:12px 17px}footer{gap:10px;font-size:10px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}

<header><div class="logo">Token <span>ATM</span> ↗</div><small>你的行动，都有价值。</small></header>
<main><section class="hero"><div class="intro"><div class="eyebrow">SMALL STEPS. REAL REWARDS.</div><h1>把今天的努力，<br>存成明天的奖励。</h1><p>专注学习，好好运动。每完成一件小事，<br>就给自己的 Token 钱包存一笔。</p></div><div class="wallet"><small>可用余额 · YOUR WALLET</small><div class="balance" id="balance"></div><div class="stats"><div><b id="earned"></b><small>累计赚取</small></div><div><b id="today"></b><small>今日完成</small></div><div><b id="spent"></b><small>累计兑换</small></div></div></div></section>
<nav class="tabs" aria-label="页面栏目"><button data-tab="tasks" class="active">每日任务</button><button data-tab="rewards">奖励商店</button><button data-tab="history">钱包记录</button></nav><section id="content"></section>
<footer><span>只和昨天的自己比较。减脂奖励健康习惯，不奖励挨饿。</span><span>数据仅存于当前浏览器 · <button class="danger" id="export">导出备份</button> · <button class="danger" id="import">恢复备份</button></span></footer></main>
<dialog id="editor"><form id="form"><h2 id="form-title"></h2><label for="name">名称</label><input id="name" required maxlength="60" placeholder="给你的小目标起个名字"><label for="category" id="category-label">任务类型</label><select id="category"><option value="学习">学习</option><option value="运动">运动</option><option value="习惯">健康习惯</option></select><label for="points">Token 数量</label><input id="points" type="number" min="1" max="10000" step="1" required value="10"><div class="actions"><button type="button" class="outline" id="cancel">取消</button><button class="primary" type="submit">保存</button></div></form></dialog><input type="file" id="backup" accept="application/json" hidden><div id="toast" role="status"></div>
<script>
const KEY='token-atm-v1';
const initial=()=>({tasks:[{id:'t1',name:'专注学习 25 分钟',category:'学习',points:10},{id:'t2',name:'阅读并整理一页笔记',category:'学习',points:15},{id:'t3',name:'散步 30 分钟',category:'运动',points:15},{id:'t4',name:'完成一次力量训练',category:'运动',points:25},{id:'t5',name:'规律吃饭，认真休息',category:'习惯',points:10},{id:'t6',name:'睡前拉伸 10 分钟',category:'运动',points:10}],rewards:[{id:'r1',name:'放松看一集喜欢的剧',points:30},{id:'r2',name:'畅玩游戏 1 小时',points:50},{id:'r3',name:'给自己买一件小礼物',points:150}],transactions:[]});
function valid(s){return s&&Array.isArray(s.tasks)&&Array.isArray(s.rewards)&&Array.isArray(s.transactions)&&[...s.tasks,...s.rewards].every(x=>typeof x.id==='string'&&typeof x.name==='string'&&Number.isSafeInteger(x.points)&&x.points>0&&x.points<=10000)&&s.transactions.every(x=>typeof x.id==='string'&&typeof x.name==='string'&&Number.isSafeInteger(x.amount)&&typeof x.date==='string'&&typeof x.day==='string')}
let state;try{state=JSON.parse(localStorage.getItem(KEY));if(!valid(state))state=initial()}catch{state=initial()}let tab='tasks';const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const day=()=>new Date().toLocaleDateString('en-CA');const balance=()=>state.transactions.reduce((n,t)=>n+t.amount,0);const done=id=>state.transactions.some(t=>t.taskId===id&&t.day===day());let toastTimer;
function toast(text){$('#toast').textContent=text;$('#toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').style.display='none',3000)}
function commit(next){try{localStorage.setItem(KEY,JSON.stringify(next));state=next;render();return true}catch{toast('浏览器无法保存，请检查存储空间或隐私设置。');return false}}
function render(){const earned=state.transactions.filter(t=>t.amount>0).reduce((n,t)=>n+t.amount,0);$('#balance').innerHTML=balance()+'<span>TOKENS</span>';$('#earned').textContent=earned;$('#spent').textContent=earned-balance();$('#today').textContent=state.transactions.filter(t=>t.amount>0&&t.day===day()).length+' 件';document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
if(tab==='history'){$('#content').innerHTML='<div class="section-head"><div><h2>每一笔，都算数。</h2><span class="muted">记录你的努力和奖励</span></div></div><div class="history">'+(state.transactions.slice().reverse().map(t=>'<div class="entry"><div>'+esc(t.name)+'<small>'+esc(new Date(t.date).toLocaleString('zh-CN'))+'</small></div><b class="tokens '+(t.amount<0?'negative':'')+'">'+(t.amount>0?'+':'')+t.amount+'</b></div>').join('')||'<div class="empty">钱包还没有记录。完成第一项任务，开始存入努力吧。</div>')+'</div>';return}
const tasks=tab==='tasks',items=state[tab];$('#content').innerHTML='<div class="section-head"><div><h2>'+(tasks?'今天，存一点进步。':'努力之后，也要奖励自己。')+'</h2><span class="muted">'+(tasks?'每项任务每天可领取一次 · 按实际完成情况打卡':'自定义你喜欢的奖励 · 兑换后自行兑现')+'</span></div><button class="outline" id="add">＋ '+(tasks?'添加任务':'添加奖励')+'</button></div><div class="grid">'+items.map(x=>'<article class="card"><div class="card-top"><div class="icon">'+(tasks?(x.category==='学习'?'📖':x.category==='运动'?'🌿':'☀️'):'🎁')+'</div><span class="pill">'+(tasks?esc(x.category):'给自己的奖励')+'</span></div><h3>'+esc(x.name)+'</h3><p>'+(tasks?'小小的行动，稳稳地向前。':'让积累的努力变成喜欢的时刻。')+'</p><div class="card-foot"><span class="tokens">'+(tasks?'+':'')+x.points+' tokens</span><button class="primary" data-action="'+x.id+'" '+((tasks?done(x.id):balance()<x.points)?'disabled':'')+' '+(tasks&&done(x.id)?'disabled':'')+'>'+(tasks?(done(x.id)?'今日已完成 ✓':'完成 · 存入'):'兑换奖励')+'</button></div><button class="danger" data-delete="'+x.id+'">移除'+(tasks?'任务':'奖励')+'</button></article>').join('')+'</div>';$('#add').onclick=openEditor}
function openEditor(){const tasks=tab==='tasks';$('#form').reset();$('#form-title').textContent=tasks?'添加每日任务':'添加你的奖励';$('#category').hidden=!tasks;$('#category-label').hidden=!tasks;$('#editor').showModal();$('#name').focus()}
document.querySelector('.tabs').onclick=e=>{if(e.target.dataset.tab){tab=e.target.dataset.tab;render()}};
$('#content').onclick=e=>{const id=e.target.dataset.action,remove=e.target.dataset.delete;if(remove){if(confirm('移除这项内容？已有钱包记录会保留。'))commit({...state,[tab]:state[tab].filter(x=>x.id!==remove)});return}if(!id)return;const x=state[tab].find(x=>x.id===id);if(!x)return;const tasks=tab==='tasks';if(tasks&&done(id))return;if(!tasks&&(balance()<x.points||!confirm('使用 '+x.points+' tokens 兑换「'+x.name+'」？')))return;const t={id:crypto.randomUUID(),name:x.name,amount:tasks?x.points:-x.points,date:new Date().toISOString(),day:day(),...(tasks?{taskId:id}:{rewardId:id})};if(commit({...state,transactions:[...state.transactions,t]}))toast(tasks?'已存入 '+x.points+' tokens，做得不错！':'兑换成功，享受你的奖励！')};
$('#cancel').onclick=()=>$('#editor').close();$('#form').onsubmit=e=>{e.preventDefault();const name=$('#name').value.trim(),points=Number($('#points').value);if(!name||!Number.isSafeInteger(points)||points<1||points>10000)return;const item={id:crypto.randomUUID(),name,points,...(tab==='tasks'?{category:$('#category').value}:{})};if(commit({...state,[tab]:[...state[tab],item]}))$('#editor').close()};
$('#export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='token-atm-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('#import').onclick=()=>$('#backup').click();$('#backup').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const next=JSON.parse(await file.text());if(!valid(next)||next.transactions.reduce((n,t)=>n+t.amount,0)<0)throw Error();if(confirm('恢复备份将替换当前数据，确定继续？')&&commit(next))toast('备份恢复成功')}catch{toast('无法读取备份，请选择有效的 Token ATM 备份文件。')}e.target.value=''};render();
</script></html>
